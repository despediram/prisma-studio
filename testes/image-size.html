<!doctype html>
<!-- Prisma Studio — conferência manual em navegador: dimensões, ampliação e histórico.
     Sirva a pasta do projeto ou abra este arquivo em file://; não usa rede nem modelos de IA. -->
<html lang="pt-BR"><meta charset="utf-8"><title>Prisma — imagens grandes</title>
<style>body{background:#17191e;color:#eee;font:16px system-ui;margin:24px}button{padding:12px;margin:4px;background:#06b8e6;border:0;border-radius:9px;font-weight:700}iframe{width:390px;height:850px;border:1px solid #555;border-radius:12px;float:left;margin-right:24px}pre{white-space:pre-wrap;line-height:1.7}h1{font-size:24px}</style>
<h1>Prisma · imagens grandes no celular</h1><button id="large">1. Abrir 24 MP e selecionar saída de 96 MP</button><button id="small">2. Ampliar, aplicar e desfazer</button>
<p>O teste de 96 MP confere a liberação do tamanho; a exportação real usa uma imagem pequena para não sobrecarregar este navegador.</p>
<iframe id="app" src="../index.html" title="Prisma em largura de celular"></iframe><pre id="report">Pronto para testar.</pre>
<script>
const frame=document.querySelector('#app'),out=document.querySelector('#report');let errors=[];
const log=t=>out.textContent+='\n'+t,check=(v,m)=>{if(!v)throw Error(m);log('✓ '+m)},wait=async fn=>{const t=Date.now();while(!fn()){if(Date.now()-t>60000)throw Error('Tempo excedido');await new Promise(r=>setTimeout(r,100));}return fn()};
frame.onload=()=>{frame.contentWindow.addEventListener('error',e=>errors.push(e.message));frame.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))};
async function prepare(w,h){const win=frame.contentWindow,P=win.PS;await wait(()=>P?.doc);const c=P.canvas(w,h),x=P.ctx(c),g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#06b8e6');g.addColorStop(1,'#f34d9c');x.fillStyle=g;x.fillRect(0,0,w,h);P.doc.load(c,'Teste '+w+' × '+h);c.width=c.height=1;P.afterOpen();check(P.doc.w===w&&P.doc.h===h,'Abertura preserva '+w+' × '+h+' px');await P.openUpscaler();const f=win.document.querySelector('#upscalerDialog iframe');await wait(()=>f.contentDocument?.querySelector('#go')&&!f.contentDocument.querySelector('#go').disabled);f.contentWindow.addEventListener('error',e=>errors.push(e.message));return f.contentDocument;}
function two(d){d.querySelector('input[name="scale"][value="2"]').checked=true;d.querySelector('input[name="scale"][value="2"]').dispatchEvent(new Event('change'));}
document.querySelector('#large').onclick=async()=>{out.textContent='Testando…';try{const d=await prepare(6000,4000);two(d);check(d.querySelector('#outputSummary').textContent.includes('12000 × 8000'),'Saída selecionada: 12000 × 8000 px (96 MP)');check(!d.querySelector('#go').disabled,'Melhorar imagem habilitado acima dos antigos 32 MP móveis');check(!errors.length,'Sem erros de JavaScript');d.querySelector('#outputSummary').scrollIntoView();log('Teste concluído.');}catch(e){log('FALHA: '+e.message)}};
document.querySelector('#small').onclick=async()=>{out.textContent='Testando…';try{const win=frame.contentWindow;win.document.querySelector('#upscalerDialog header button')?.click();const d=await prepare(300,200);two(d);d.querySelector('#upEngine').value='classic';d.querySelector('#upEngine').dispatchEvent(new Event('change'));for(const k of ['Clean','Blur','Face','Sharp','Clar','Color'])d.querySelector('#on'+k).checked=false;d.querySelector('#go').click();await wait(()=>!d.querySelector('#applyEditor').disabled);check(d.querySelector('#meta').textContent.includes('600×400'),'Processamento e PNG final em 600 × 400 px');d.querySelector('#applyEditor').click();await wait(()=>win.PS.doc.w===600);check(win.PS.doc.h===400,'Resultado aplicado no editor');win.PS.doc.undo();check(win.PS.doc.w===300&&win.PS.doc.h===200,'Desfazer recupera resolução original');win.PS.doc.redo();check(win.PS.doc.w===600&&win.PS.doc.h===400,'Refazer recupera ampliação');check(!errors.length,'Sem erros de JavaScript');log('Teste concluído.');}catch(e){log('FALHA: '+e.message)}};
</script></html>
