<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência visual Prisma Atelier</title><style>body{margin:0;background:#302c38;color:white;font:13px system-ui}header{padding:8px;display:flex;gap:8px;align-items:center}button,select{padding:9px}iframe{display:block;margin:0 auto;border:0;width:390px;height:844px}output{white-space:pre-wrap}</style><header><select id="size" aria-label="Tamanho da tela"><option>320</option><option selected>390</option><option>768</option><option>1200</option><option>1440</option></select><button id="run" disabled>Conferir navegação</button><button id="sample">Imagem de exemplo</button><button id="theme">Alternar tema</button><output id="result">Carregando…</output></header><iframe id="app" src="../index.html"></iframe><script>
const f=document.querySelector('#app');f.onload=()=>{document.querySelector('#run').disabled=false;document.querySelector('#result').textContent='Pronto';};document.querySelector('#size').onchange=e=>{f.style.width=e.target.value+'px';f.style.height=+e.target.value>860?'850px':'844px';};document.querySelector('#sample').onclick=()=>f.contentDocument.querySelector('#btnSample').click();document.querySelector('#theme').onclick=()=>f.contentDocument.querySelector('#btnTheme').click();document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');out.textContent='Testando…';try{const s=f.contentDocument.createElement('script');s.src='testes/atelier-interactions.js';await new Promise((ok,no)=>{s.onload=ok;s.onerror=no;f.contentDocument.body.append(s);});out.textContent='APROVADO '+JSON.stringify(await f.contentWindow.prismaTestAtelier(f.contentWindow.PS));}catch(e){out.textContent='FALHA: '+e.message;}};
</script></html>
