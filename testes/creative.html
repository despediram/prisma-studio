<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência criativa do Prisma</title><style>body{margin:0;background:#16181c;color:white;font:14px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center}button{padding:10px}iframe{display:block;margin:auto;border:1px solid #444;width:390px;height:844px}output{white-space:pre-wrap}</style><header><button id="run" disabled>Testar criação e IA local</button><button id="ai">Ver recorte de IA</button><button id="size">Alternar PC / celular</button><output id="result">Carregando…</output></header><iframe id="app" src="../index.html"></iframe><script>const f=document.querySelector('#app');f.addEventListener('load',()=>{document.querySelector('#run').disabled=false;document.querySelector('#result').textContent='Pronto';});document.querySelector('#size').onclick=()=>{const pc=f.style.width!=='1200px';f.style.width=pc?'1200px':'390px';f.style.height=pc?'820px':'844px';};document.querySelector('#ai').onclick=async()=>{const img=new f.contentWindow.Image();img.onload=()=>f.contentWindow.PS.openBackgroundAI({source:img,name:'Foto de teste',apply:()=>{}});img.src='testes/fixtures/car.jpg';};document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');out.textContent='Testando…';try{const s=f.contentDocument.createElement('script');s.src='testes/creative-interactions.js';await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;f.contentDocument.body.append(s);});out.textContent='APROVADO '+JSON.stringify(await f.contentWindow.prismaTestCreative(f.contentWindow.PS,'testes/fixtures/car.jpg'));}catch(e){out.textContent='FALHA: '+e.message;}};</script></html>
