<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência do editor Prisma</title><style>body{margin:0;background:#16181c;color:white;font:14px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center}button{padding:10px}iframe{display:block;margin:auto;border:1px solid #444;width:390px;height:844px}output{white-space:pre-wrap}</style><header><button id="run" disabled>Testar corte, texto e histórico</button><button id="size">Alternar PC / celular</button><output id="result">Pronto para testar</output></header><iframe id="app" src="../index.html"></iframe><script>const f=document.querySelector('#app');f.addEventListener('load',()=>{document.querySelector('#run').disabled=false;});document.querySelector('#size').onclick=()=>{const mobile=f.style.width!=='1200px';f.style.width=mobile?'1200px':'390px';f.style.height=mobile?'820px':'844px';};document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');out.textContent='Testando…';try{const s=f.contentDocument.createElement('script');s.src='testes/editor-interactions.js';f.contentDocument.body.append(s);await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;});out.textContent='APROVADO '+JSON.stringify(await f.contentWindow.prismaTestInteractions(f.contentWindow.PS));}catch(e){out.textContent='FALHA: '+e.message;}};</script></html>
