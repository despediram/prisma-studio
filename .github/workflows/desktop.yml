# Prisma Studio — testa o aplicativo em Windows e publica o instalador completo.
name: Compilar Prisma Studio Windows
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'upscaler/**'
      - 'vendor/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar ferramentas com versões fixas
        run: npm ci --no-audit --no-fund
      - name: Validar recuperação e planejamento de imagens
        run: |
          npm run test:desktop
          node testes/image-size.cjs
          node testes/upscale-plan.cjs
          npm run prepare:desktop
      - name: Testar o aplicativo real no Windows
        run: npm run test:desktop:smoke
        timeout-minutes: 5
      - name: Compilar instalador Windows de 64 bits
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Studio-Windows-x64
          path: dist-desktop/*-Setup.exe
          if-no-files-found: error
      - name: Publicar instalador na página de versões
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "desktop-v$version-build-${{ github.run_number }}"
          $installer = Get-ChildItem dist-desktop/*-Setup.exe
          gh release create $tag $installer.FullName --target '${{ github.sha }}' --title "Prisma Studio Windows $version · build ${{ github.run_number }}" --notes-file desktop/RELEASE.md
